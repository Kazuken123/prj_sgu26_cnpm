services:
  database:
    image: mysql:8.0
    container_name: food_tour_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: food_tour_db
    ports:
      - "3306:3306"
    volumes:
      - ./database/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: food_tour_backend
    restart: always
    environment:
      PORT: 3000
      DB_HOST: database
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: food_tour_db
      JWT_SECRET: super_secret_jwt_key_2026
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy

volumes:
  db_data:
