services:
  database:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-food_tour_db}
      MYSQL_USER: ${DB_USER:-food_tour_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - ./database/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Temporary counters only. No host port and no business data persisted here.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: database
      DB_USER: ${DB_USER:-food_tour_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-food_tour_db}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 bytes)}
      REDIS_URL: redis://redis:6379
      VISIT_PRICE_VND: ${VISIT_PRICE_VND:-}
      VISIT_VALIDITY_HOURS: ${VISIT_VALIDITY_HOURS-24}
      CASH_CODE_TTL_SECONDS: ${CASH_CODE_TTL_SECONDS-600}
      ONLINE_CODE_TTL_SECONDS: ${ONLINE_CODE_TTL_SECONDS-900}
      ONLINE_EXCHANGE_WINDOW_SECONDS: ${ONLINE_EXCHANGE_WINDOW_SECONDS-60}
      ONLINE_EXCHANGE_IP_LIMIT: ${ONLINE_EXCHANGE_IP_LIMIT-30}
      ONLINE_EXCHANGE_SESSION_LIMIT: ${ONLINE_EXCHANGE_SESSION_LIMIT-5}
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-disabled}
      MOCK_PAYMENT_BASE_URL: ${MOCK_PAYMENT_BASE_URL:-}
      MOCK_WEBHOOK_SECRET: ${MOCK_WEBHOOK_SECRET:-}
      CASH_EXCHANGE_WINDOW_SECONDS: ${CASH_EXCHANGE_WINDOW_SECONDS-60}
      CASH_EXCHANGE_IP_LIMIT: ${CASH_EXCHANGE_IP_LIMIT-30}
      CASH_EXCHANGE_SESSION_LIMIT: ${CASH_EXCHANGE_SESSION_LIMIT-5}
      VISIT_LOOKUP_WINDOW_SECONDS: ${VISIT_LOOKUP_WINDOW_SECONDS:-60}
      VISIT_LOOKUP_IP_LIMIT: ${VISIT_LOOKUP_IP_LIMIT:-60}
      VISIT_LOOKUP_SESSION_LIMIT: ${VISIT_LOOKUP_SESSION_LIMIT:-20}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  db_data:
