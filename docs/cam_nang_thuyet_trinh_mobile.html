    let currentIdx = 0;

    function renderSlide(idx) {
      if (idx < 0 || idx >= slides.length) return;
      currentIdx = idx;
      
      const s = slides[idx];
      document.getElementById("current-speaker").innerText = s.speaker;
      document.getElementById("nav-indicator").innerText = `${s.num} / ${slides.length}`;

      const container = document.getElementById("slides-container");
      container.innerHTML = `
        <div class="card" id="card-${s.num}">
          <div class="card-top">
            <span class="badge-slide">SLIDE ${s.num}</span>
            <span class="badge-speaker">${s.speaker}</span>
          </div>
          <div class="slide-title">${s.title}</div>
          <div class="cue-box">
            <div class="cue-label">ĐIỂM NHÌN TRÊN MÀN HÌNH</div>
            <div class="cue-text">${s.cue}</div>
          </div>
          <div class="speech-box">
            ${s.speech.map(p => `<p>${p}</p>`).join("")}
          </div>
        </div>
      `;

      // Cập nhật jump bar
      document.querySelectorAll(".jump-bar a").forEach((el, i) => {
        if (i === idx) {
          el.classList.add("active");
          el.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        } else {
          el.classList.remove("active");
        }
      });

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function initJumpBar() {
      const jb = document.getElementById("jump-bar");
      jb.innerHTML = slides.map((s, idx) => `
        <a href="javascript:void(0)" onclick="renderSlide(${idx})">S${s.num}</a>
      `).join("");
    }

    function nextSlide() {
      if (currentIdx < slides.length - 1) {
        renderSlide(currentIdx + 1);
      }
    }

    function prevSlide() {
      if (currentIdx > 0) {
        renderSlide(currentIdx - 1);
      }
    }

    // Phím bấm mũi tên
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "PageDown") nextSlide();
      if (e.key === "ArrowLeft" || e.key === "PageUp") prevSlide();
    });

    initJumpBar();
    renderSlide(0);
  </script>
