<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập · Food Tour</title>
  <style>
    body{font:16px system-ui,sans-serif;background:#f4f5f7;color:#17212b;margin:0;padding:40px 20px}
    main{max-width:420px;margin:auto;background:white;padding:28px;border-radius:12px}
    h1{margin-top:0;font-size:26px}label{display:block;margin-top:18px}
    input,button{box-sizing:border-box;width:100%;font:inherit;padding:12px;margin-top:6px;border-radius:6px;border:1px solid #abb5bf}
    button{margin-top:22px;background:#174f82;color:white;cursor:pointer}button:disabled{opacity:.6}
    a{color:#174f82}#message{line-height:1.5}
  </style>
  <script src="auth.js" defer></script>
</head>
<body>
<main>
  <h1>Đăng nhập</h1><p>Hệ thống du lịch ẩm thực</p>
  <form id="loginForm">
    <label for="email">Email</label><input type="email" id="email" autocomplete="username" required maxlength="255">
    <label for="password">Mật khẩu</label><input type="password" id="password" autocomplete="current-password" required minlength="8">
    <button id="submitButton">Đăng nhập</button>
  </form>
  <p id="message" role="status" aria-live="polite"></p>
  <p>Chưa có tài khoản? <a href="register.html">Đăng ký</a></p>
</main>
<script>
  document.getElementById("loginForm").addEventListener("submit", async event => {
    event.preventDefault();
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");
    button.disabled = true; message.textContent = "Đang đăng nhập…";
    try {
      const result = await FoodTourAuth.request("/login", { body: {
        email: document.getElementById("email").value, password: document.getElementById("password").value,
      } });
      FoodTourAuth.saveSession(result.data);
      window.location.href = "account.html";
    } catch (error) { message.textContent = error.message; }
    finally { button.disabled = false; }
  });
</script>
</body>
</html>
