<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Đăng nhập</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-lg">
      <!-- Tiêu đề -->
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-gray-800">Đăng nhập</h1>

        <p class="text-gray-500 mt-2">Hệ thống Du lịch Ẩm thực</p>
      </div>

      <!-- Form Login -->
      <form id="loginForm" class="space-y-5">
        <!-- Username -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Username
          </label>

          <input
            type="text"
            id="username"
            name="username"
            placeholder="Nhập username"
            required
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Password
          </label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Nhập password"
            required
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <!-- Button -->
        <button
          type="submit"
          class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition"
        >
          Login
        </button>
      </form>

      <!-- Thông báo -->
      <p id="message" class="text-center mt-5 text-sm"></p>
    </div>

    <script>
      // ==========================================
      // API URL
      // ==========================================

      const API_URL = "http://localhost:3000/api";

      // ==========================================
      // Xử lý Login
      // ==========================================

      document
        .getElementById("loginForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          const username = document.getElementById("username").value;

          const password = document.getElementById("password").value;

          const message = document.getElementById("message");

          try {
            console.log("========== LOGIN ==========");
            console.log("Username:", username);
            console.log("Đang gọi API:", `${API_URL}/login`);

            const response = await fetch(`${API_URL}/login`, {
              method: "POST",

              headers: {
                "Content-Type": "application/json",
              },

              body: JSON.stringify({
                username: username,
                password: password,
              }),
            });

            // Kiểm tra HTTP status
            if (!response.ok) {
              throw new Error(
                `Login thất bại. HTTP Status: ${response.status}`,
              );
            }

            const data = await response.json();

            console.log("Login thành công!");
            console.log("Response:", data);

            // ==========================================
            // Nếu Backend trả token
            // ==========================================

            if (data.token) {
              localStorage.setItem("token", data.token);
            }

            // Có thể lưu thông tin user nếu backend trả về
            if (data.user) {
              localStorage.setItem("user", JSON.stringify(data.user));
            }

            message.textContent = "Đăng nhập thành công!";

            message.className = "text-center mt-5 text-sm text-green-600";

            // Chuyển sang dashboard
            setTimeout(function () {
              window.location.href = "dashboard.html";
            }, 500);
          } catch (error) {
            console.error("Lỗi Login:", error);

            message.textContent = "Đăng nhập thất bại. Kiểm tra Backend/API.";

            message.className = "text-center mt-5 text-sm text-red-600";
          }
        });
    </script>
  </body>
</html>
