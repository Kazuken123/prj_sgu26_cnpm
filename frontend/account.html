<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tài khoản nội bộ · Chùa Linh Ứng</title>
  <style>
    body{font:16px system-ui,sans-serif;background:#f4f5f7;color:#17212b;margin:0;padding:40px 20px}
    main{max-width:540px;margin:auto;background:white;padding:28px;border-radius:12px}
    h1{margin-top:0;font-size:26px}dt{font-weight:600;margin-top:14px}dd{margin:4px 0;overflow-wrap:anywhere}
    button{font:inherit;padding:10px 16px;border-radius:6px;border:1px solid #174f82;background:#174f82;color:white;cursor:pointer}
    section{border-top:1px solid #d5dae0;margin-top:24px;padding-top:16px}[hidden]{display:none}
  </style>
  <script src="auth.js" defer></script>
</head>
<body><main>
  <h1>Tài khoản của bạn</h1>
  <p id="message" role="status" aria-live="polite">Đang tải tài khoản…</p>
  <dl id="profile" hidden><dt>Email</dt><dd id="email"></dd><dt>Vai trò</dt><dd id="role"></dd><dt>Trạng thái tài khoản</dt><dd id="status"></dd></dl>
  <section id="adminSection" hidden><h2>Quản lý tài khoản</h2><p><a href="staff.html">Tạo tài khoản nhân viên</a></p></section>
  <button id="logoutButton" type="button">Đăng xuất</button>
</main>
<script>
  const labels = { STAFF: "Nhân viên", ADMIN: "Quản trị viên", ACTIVE: "Đang hoạt động", LOCKED: "Đã khóa" };
  async function loadAccount() {
    if (!FoodTourAuth.hasSession()) { window.location.replace("index.html"); return; }
    try {
      const { data: user } = await FoodTourAuth.request("/me", { authenticated: true });
      document.getElementById("email").textContent = user.email;
      document.getElementById("role").textContent = labels[user.role] || user.role;
      document.getElementById("status").textContent = labels[user.status] || user.status;
      document.getElementById("profile").hidden = false; document.getElementById("message").textContent = "";
      document.getElementById("adminSection").hidden = user.role !== "ADMIN";
    } catch (error) { document.getElementById("message").textContent = error.message; }
  }
  document.getElementById("logoutButton").addEventListener("click", async () => {
    const button = document.getElementById("logoutButton"); button.disabled = true;
    try { await FoodTourAuth.logout(); window.location.replace("index.html"); }
    catch (error) { document.getElementById("message").textContent = error.message; }
    finally { button.disabled = false; }
  });
  window.addEventListener("DOMContentLoaded", loadAccount);
</script>
</body></html>
