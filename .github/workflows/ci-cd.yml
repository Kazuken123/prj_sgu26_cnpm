name: CI and Release Smoke Test - Backend 3 Layers

on:
  push:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-database:
    name: CI - Database Schema (MySQL 8.0)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: food_tour_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Initialize disposable CI database
        env:
          MYSQL_PWD: root
        run: mysql -h 127.0.0.1 -u root food_tour_db < database/init_db.sql
      - name: Check exact table count
        env:
          MYSQL_PWD: root
        run: |
          TABLE_COUNT=$(mysql -h 127.0.0.1 -u root -s -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='food_tour_db';")
          test "$TABLE_COUNT" -eq 15

  ci-backend:
    name: CI - Backend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Check syntax and layer dependencies
        working-directory: backend
        run: npm run lint
      - name: Unit, HTTP and real MySQL integration tests
        working-directory: backend
        env:
          NODE_ENV: test
          RUN_DB_TESTS: "1"
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: food_tour_db
          JWT_SECRET: ci-test-only-secret-at-least-32-bytes
        run: npm test

  review-decoupling:
    name: Review - Layer Boundaries and Environment Files
    needs: [ci-database, ci-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Verify imports follow Router -> Service -> Store
        working-directory: backend
        run: npm run lint
      - name: Verify environment files are not tracked
        run: |
          if [ -n "$(git ls-files .env backend/.env)" ]; then
            echo "Runtime environment files must not be committed."
            exit 1
          fi

  cd-build-and-deliver:
    name: Release - Build and Package
    needs: review-decoupling
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        run: docker build -f backend/Dockerfile -t food-tour-backend:${{ github.sha }} .
      - name: Package complete release source
        run: |
          tar --exclude='backend/node_modules' --exclude='backend/.env' --exclude='backend/.env.*' --exclude='backend/tests' \
            -czf deploy-bundle-${{ github.sha }}.tar.gz \
            backend frontend database docker-compose.yml .env.example .dockerignore
          for file in backend/routers/auth.router.js backend/services/auth.service.js backend/stores/auth.store.js backend/middlewares/auth.middleware.js; do
            tar -tzf deploy-bundle-${{ github.sha }}.tar.gz | grep -Fx "$file"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle-${{ github.sha }}
          path: deploy-bundle-${{ github.sha }}.tar.gz
          retention-days: 7

  release-smoke-test:
    name: Release - Test the Published Bundle (not staging)
    needs: cd-build-and-deliver
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      MYSQL_ROOT_PASSWORD: ci-disposable-root-password
      DB_USER: food_tour_app
      DB_PASSWORD: ci-disposable-app-password
      JWT_SECRET: ci-disposable-secret-at-least-32-bytes
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deploy-bundle-${{ github.sha }}
      - name: Unpack the exact release artifact
        run: tar -xzf deploy-bundle-${{ github.sha }}.tar.gz
      - name: Start release containers
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Smoke test readiness and the auth lifecycle
        run: node backend/scripts/smoke-auth.js
      - name: Container logs on failure
        if: failure()
        run: docker compose logs
      - name: Remove disposable CI containers
        if: always()
        run: docker compose down -v
