name: CI and Release Smoke Test - Backend 3 Layers

on:
  push:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-frontend:
    name: CI - Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install backend dependencies for frontend contract tests
        working-directory: backend
        run: npm ci --ignore-scripts
      - name: Frontend API, component and backend contract regression tests
        working-directory: frontend
        run: npm test
      - name: Type check and build frontend
        working-directory: frontend
        run: npm run build

  ci-database:
    name: CI - Database Schema (MySQL 8.0)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: food_tour_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Initialize disposable CI database
        env:
          MYSQL_PWD: root
        run: mysql -h 127.0.0.1 -u root food_tour_db < database/init_db.sql
      - name: Check exact table count
        env:
          MYSQL_PWD: root
        run: |
          TABLE_COUNT=$(mysql -h 127.0.0.1 -u root -s -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='food_tour_db';")
          test "$TABLE_COUNT" -eq 16

  ci-backend:
    name: CI - Backend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Check syntax and layer dependencies
        working-directory: backend
        run: npm run lint
      - name: Unit, HTTP and real MySQL integration tests with coverage
        working-directory: backend
        env:
          NODE_ENV: test
          RUN_DB_TESTS: "1"
          RUN_REDIS_TESTS: "1"
          REDIS_URL: redis://127.0.0.1:6379
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: food_tour_db
          JWT_SECRET: ci-test-only-secret-at-least-32-bytes
        run: |
          set -o pipefail
          npm run test:coverage | tee coverage.log
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            echo "### Backend Test Coverage Baseline" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            sed -n '/start of coverage report/,/end of coverage report/p' coverage.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  review-decoupling:
    name: Review - Layer Boundaries and Environment Files
    needs: [ci-database, ci-backend, ci-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Verify imports follow Router -> Service -> Store
        working-directory: backend
        run: npm run lint
      - name: Verify environment files are not tracked
        run: |
          if [ -n "$(git ls-files .env backend/.env)" ]; then
            echo "Runtime environment files must not be committed."
            exit 1
          fi

  cd-build-and-deliver:
    name: Release - Build and Package
    needs: review-decoupling
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        run: docker build -f backend/Dockerfile -t food-tour-backend:${{ github.sha }} .
      - name: Package complete release source
        run: |
          tar --exclude='backend/node_modules' --exclude='backend/.env' --exclude='backend/.env.*' --exclude='backend/tests' \
            -czf deploy-bundle-${{ github.sha }}.tar.gz \
            backend frontend database docker-compose.yml .env.example .dockerignore
          for file in backend/routers/auth.router.js backend/services/auth.service.js backend/stores/auth.store.js backend/middlewares/auth.middleware.js; do
            tar -tzf deploy-bundle-${{ github.sha }}.tar.gz | grep -Fx "$file"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle-${{ github.sha }}
          path: deploy-bundle-${{ github.sha }}.tar.gz
          retention-days: 7

  release-smoke-test:
    name: Release - Test the Published Bundle (not staging)
    needs: cd-build-and-deliver
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      MYSQL_ROOT_PASSWORD: ci-disposable-root-password
      DB_USER: food_tour_app
      DB_PASSWORD: ci-disposable-app-password
      JWT_SECRET: ci-disposable-secret-at-least-32-bytes
      BOOTSTRAP_ADMIN_EMAIL: ci-admin@example.invalid
      BOOTSTRAP_ADMIN_PASSWORD: ci-disposable-admin-${{ github.run_id }}-Aa1!
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deploy-bundle-${{ github.sha }}
      - name: Unpack the exact release artifact
        run: tar -xzf deploy-bundle-${{ github.sha }}.tar.gz
      - name: Start release containers
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Bootstrap ADMIN in the disposable release database
        run: docker compose exec -T -e BOOTSTRAP_ADMIN_EMAIL -e BOOTSTRAP_ADMIN_PASSWORD backend npm run bootstrap:admin
      - name: Smoke test ADMIN-created STAFF and the auth lifecycle
        run: node backend/scripts/smoke-auth.js
      - name: Smoke test the compiled frontend and client routes
        run: node backend/scripts/smoke-frontend.js
      - name: Container logs on failure
        if: failure()
        run: docker compose logs
      - name: Remove disposable CI containers
        if: always()
        run: docker compose down -v

  deploy-render-staging:
    name: CD - Render staging (exact commit and new process)
    needs: release-smoke-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: render-tcv-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Refuse to deploy a superseded main commit
        id: head
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_MAIN=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$CURRENT_MAIN" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Main advanced: this run does not deploy or claim staging success." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Require the protected Render deploy hook
        if: steps.head.outputs.current == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Missing RENDER_DEPLOY_HOOK_URL repository secret. No deploy was triggered."
            exit 1
          fi
      - name: Build the staging Dockerfile before triggering Render
        if: steps.head.outputs.current == 'true'
        run: docker build -f deploy/render/Dockerfile -t tcv-staging:${{ github.sha }} .
      - name: Deploy the checked commit and verify the new running process
        if: steps.head.outputs.current == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          STAGING_URL: https://tcv-staging.onrender.com
        run: node backend/scripts/deploy-render.js
